[package]
name = "gamefic-native"
version = "0.1.0"
description = "Gamefic desktop nativo com Slint"
license = "GPL-3.0-only"
edition = "2024"
build = "build.rs"

[dependencies]
slint = "=1.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
sha2 = "0.10"
base64 = "0.22"

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
